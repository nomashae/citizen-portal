<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — Nomashae Ministry</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── LOGIN SCREEN ── */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .login-card { width: 100%; max-width: 400px; }
    .login-brand { text-align: center; margin-bottom: 2rem; }
    .login-brand h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
    .login-brand p  { font-size: 0.72rem; color: var(--ink2); letter-spacing: 2px; text-transform: uppercase; margin-top: 0.3rem; }

    /* ── ADMIN LAYOUT ── */
    .admin-wrap { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .admin-sidebar {
      background: var(--bg2); border-right: 1px solid var(--border);
      padding: 1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar-logo { font-size: 0.85rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem; }
    .sidebar-role { font-size: 0.6rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--ink2); margin-bottom: 2rem; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
    .sidebar-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.9rem; border-radius: 9px;
      font-size: 0.8rem; font-weight: 500; color: var(--ink2); cursor: pointer;
      border: none; background: transparent; text-align: left; transition: all 0.18s; width: 100%;
    }
    .sidebar-link:hover { background: var(--card); color: var(--ink); }
    .sidebar-link.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .sidebar-link i { width: 16px; text-align: center; }
    .sidebar-section { font-size: 0.55rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--ink2); opacity: 0.5; padding: 1rem 0.9rem 0.4rem; }
    .sidebar-logout { margin-top: auto; }

    .admin-main { padding: 2rem; overflow-y: auto; }
    .admin-view { display: none; }
    .admin-view.active { display: block; }

    /* ── APPLICATIONS TABLE ── */
    .apps-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-btn {
      padding: 0.35rem 0.9rem; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--bg2); color: var(--ink2); font-size: 0.7rem; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.18s;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 10%,transparent); color: var(--accent); }

    .app-row {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.2rem 1.4rem; margin-bottom: 0.7rem;
      display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
      transition: border-color 0.2s;
    }
    .app-row:hover { border-color: color-mix(in srgb,var(--accent) 30%,transparent); }
    .app-info { flex: 1; min-width: 160px; }
    .app-name { font-size: 0.95rem; font-weight: 600; color: var(--ink); }
    .app-meta { font-size: 0.72rem; color: var(--ink2); display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .app-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .act-btn {
      padding: 0.35rem 0.85rem; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 0.68rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; background: transparent; color: var(--ink2); transition: all 0.18s;
    }
    .act-btn.approve { border-color: var(--accent); color: var(--accent); }
    .act-btn.approve:hover { background: var(--accent); color: #fff; }
    .act-btn.reject  { border-color: #c44; color: #c44; }
    .act-btn.reject:hover  { background: #c44; color: #fff; }
    .act-btn.waitlist { border-color: #8880d0; color: #8880d0; }
    .act-btn.waitlist:hover { background: #8880d0; color: #fff; }
    .act-btn.view-btn { border-color: var(--border); color: var(--ink2); }
    .act-btn.view-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 300; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: var(--radius); padding: 2rem;
      width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      position: relative;
    }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--ink2); }
    .modal-field { margin-bottom: 0.7rem; display: flex; gap: 0.8rem; }
    .modal-field .mk { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink2); min-width: 90px; padding-top: 0.15rem; }
    .modal-field .mv { font-size: 0.88rem; color: var(--ink); }
    .modal-statement { background: var(--bg2); border-radius: 10px; padding: 1rem; font-size: 0.84rem; color: var(--ink); font-weight: 300; line-height: 1.75; margin: 0.8rem 0; }
    .note-input { width: 100%; margin-top: 0.5rem; }

    /* ── NEWS FORM ── */
    .news-form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.8rem; margin-bottom: 2rem; box-shadow: var(--shadow); }
    .cat-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .cat-opt { display: none; }
    .cat-lbl { padding: 0.3rem 0.8rem; border-radius: 20px; border: 1.5px solid var(--border); font-size: 0.68rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink2); cursor: pointer; transition: all 0.18s; }
    .cat-opt:checked + .cat-lbl { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 12%,transparent); color: var(--accent); }

    /* ── NEWS LIST (admin) ── */
    .news-admin-row {
      display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
      padding: 1rem 1.2rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 0.6rem;
    }
    .news-admin-title { flex: 1; font-size: 0.9rem; font-weight: 600; color: var(--ink); }
    .news-admin-meta  { font-size: 0.7rem; color: var(--ink2); }

    /* ── STAT CARDS ── */
    .stat-row { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-mini { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; text-align: center; }
    .stat-mini .n { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-mini .l { font-size: 0.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink2); margin-top: 0.3rem; }

    @media (max-width:700px) {
      .admin-wrap { grid-template-columns: 1fr; }
      .admin-sidebar { display: none; }
      .admin-main { padding: 1.2rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="card login-card">
    <div class="login-brand">
      <div class="hero-icon" style="margin-bottom:1rem"><i class="fa-solid fa-shield-halved"></i></div>
      <h2>Ministry Portal</h2>
      <p>Nomashae · Restricted Access</p>
    </div>
    <div class="form-field" id="f-login-email">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@nomashae.gov" autocomplete="email"/>
    </div>
    <div class="form-field" id="f-login-pass">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem" id="login-btn" onclick="doLogin()">
      <i class="fa-solid fa-right-to-bracket"></i> Enter the Ministry
    </button>
    <p style="font-size:0.72rem;color:var(--ink2);text-align:center;margin-top:1rem">
      Admin accounts are managed via Firebase Authentication.
    </p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div style="display:none" id="admin-panel">
  <div class="admin-wrap">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo">Nomashae</div>
      <div class="sidebar-role" id="admin-email-display">Ministry</div>

      <div class="sidebar-section">Applications</div>
      <nav class="sidebar-nav">
        <button class="sidebar-link active" onclick="showView('dashboard')" id="lnk-dashboard">
          <i class="fa-solid fa-gauge-high"></i> Dashboard
        </button>
        <button class="sidebar-link" onclick="showView('applications')" id="lnk-applications">
          <i class="fa-solid fa-file-pen"></i> Applications
          <span id="pending-badge" style="margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:0.6rem;padding:0.1rem 0.5rem;font-weight:700"></span>
        </button>
        <div class="sidebar-section">Content</div>
        <button class="sidebar-link" onclick="showView('news')" id="lnk-news">
          <i class="fa-solid fa-newspaper"></i> Post News
        </button>
        <button class="sidebar-link" onclick="showView('newslist')" id="lnk-newslist">
          <i class="fa-solid fa-list"></i> News Archive
        </button>
        <div class="sidebar-section">Site</div>
        <button class="sidebar-link" onclick="window.open('index.html')" >
          <i class="fa-solid fa-globe"></i> View Site
        </button>
        <button class="sidebar-link sidebar-logout" onclick="doLogout()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">

      <!-- DARK TOGGLE TOP BAR -->
      <div style="display:flex;justify-content:flex-end;margin-bottom:1.5rem;gap:0.5rem">
        <button class="nav-btn" id="dark-btn">Dark</button>
      </div>

      <!-- DASHBOARD -->
      <div class="admin-view active" id="view-dashboard">
        <h1 style="font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:0.3rem">Dashboard</h1>
        <p style="font-size:0.8rem;color:var(--ink2);margin-bottom:1.5rem">Welcome to the Ministry of Internal Affairs.</p>
        <div class="stat-row" id="dash-stats"></div>
        <p class="section-label">Recent Applications</p>
        <div id="dash-recent"></div>
      </div>

      <!-- APPLICATIONS -->
      <div class="admin-view" id="view-applications">
        <h1 style="font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:1.5rem">Applications</h1>
        <div class="apps-filters">
          <button class="filter-btn active" onclick="filterApps('all',this)">All</button>
          <button class="filter-btn" onclick="filterApps('pending',this)">Pending</button>
          <button class="filter-btn" onclick="filterApps('approved',this)">Approved</button>
          <button class="filter-btn" onclick="filterApps('rejected',this)">Rejected</button>
          <button class="filter-btn" onclick="filterApps('waitlisted',this)">Waitlisted</button>
        </div>
        <div id="apps-list"><p style="color:var(--ink2);font-size:0.85rem">Loading…</p></div>
      </div>

      <!-- POST NEWS -->
      <div class="admin-view" id="view-news">
        <h1 style="font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:1.5rem">Post News / Decree</h1>
        <div class="news-form-card">
          <div class="form-field">
            <label>Category</label>
            <div class="cat-selector">
              <input class="cat-opt" type="radio" name="cat" id="cat-ann" value="Announcement" checked>
              <label class="cat-lbl" for="cat-ann">Announcement</label>
              <input class="cat-opt" type="radio" name="cat" id="cat-dec" value="Decree">
              <label class="cat-lbl" for="cat-dec">Decree</label>
              <input class="cat-opt" type="radio" name="cat" id="cat-ev" value="Event">
              <label class="cat-lbl" for="cat-ev">Event</label>
              <input class="cat-opt" type="radio" name="cat" id="cat-urg" value="Urgent">
              <label class="cat-lbl" for="cat-urg">Urgent</label>
              <input class="cat-opt" type="radio" name="cat" id="cat-hist" value="Historical Record">
              <label class="cat-lbl" for="cat-hist">Historical Record</label>
            </div>
          </div>
          <div class="form-field">
            <label>Headline <span class="req">★</span></label>
            <input type="text" id="news-title" placeholder="Ministry announces…"/>
          </div>
          <div class="form-field">
            <label>Body <span class="req">★</span></label>
            <textarea id="news-body" rows="6" placeholder="Full text of the announcement or decree…"></textarea>
          </div>
          <div class="form-field">
            <label>Author / Byline</label>
            <input type="text" id="news-author" placeholder="Ministry of Internal Affairs"/>
          </div>
          <button class="btn-primary" onclick="postNews()">
            <i class="fa-solid fa-paper-plane"></i> Publish
          </button>
        </div>
      </div>

      <!-- NEWS ARCHIVE -->
      <div class="admin-view" id="view-newslist">
        <h1 style="font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:1.5rem">News Archive</h1>
        <div id="news-admin-list"><p style="color:var(--ink2);font-size:0.85rem">Loading…</p></div>
      </div>

    </main>
  </div>
</div>

<!-- APPLICATION DETAIL MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast"><i class="fa-solid fa-circle-check"></i><span id="toast-msg"></span></div>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, getDocs,
    doc, updateDoc, addDoc, deleteDoc, serverTimestamp, where, getCountFromServer
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const app  = initializeApp(FIREBASE_CONFIG);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  window._db = db; window._auth = auth;
  window._col = collection; window._q = query; window._orderBy = orderBy;
  window._getDocs = getDocs; window._doc = doc; window._updateDoc = updateDoc;
  window._addDoc = addDoc; window._deleteDoc = deleteDoc;
  window._serverTimestamp = serverTimestamp; window._where = where;
  window._getCount = getCountFromServer;

  // Auth state listener
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('admin-email-display').textContent = user.email;
      loadDashboard();
      loadApplications();
      loadNewsArchive();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-panel').style.display = 'none';
    }
  });

  window.doLogin = async function() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    const btn   = document.getElementById('login-btn');
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Enter the Ministry';
      showToast('Login failed: ' + (e.code === 'auth/wrong-password' ? 'Wrong password.' : e.code === 'auth/user-not-found' ? 'User not found.' : e.message));
    }
  };

  window.doLogout = async function() {
    await signOut(auth);
    showToast('Logged out.');
  };

  // ── DASHBOARD ──
  window.loadDashboard = async function() {
    try {
      const statuses = ['pending','approved','rejected','waitlisted'];
      const counts = {};
      for (const s of statuses) {
        const snap = await window._getCount(window._q(window._col(db,'applications'), window._where('status','==',s)));
        counts[s] = snap.data().count;
      }
      const newsSnap = await window._getCount(window._col(db,'news'));
      const total = Object.values(counts).reduce((a,b)=>a+b,0);

      document.getElementById('dash-stats').innerHTML = [
        ['Total Applications', total, 'fa-file-pen'],
        ['Pending', counts.pending, 'fa-clock'],
        ['Approved', counts.approved, 'fa-check'],
        ['Rejected', counts.rejected, 'fa-xmark'],
        ['Waitlisted', counts.waitlisted, 'fa-hourglass-half'],
        ['News Posts', newsSnap.data().count, 'fa-newspaper'],
      ].map(([l,n,ic]) => `<div class="stat-mini"><i class="fa-solid ${ic}" style="color:var(--accent);margin-bottom:0.4rem;display:block"></i><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

      document.getElementById('pending-badge').textContent = counts.pending || '';

      // Recent
      const recent = await window._getDocs(window._q(window._col(db,'applications'), window._orderBy('submittedAt','desc')));
      let html = '';
      let count = 0;
      recent.forEach(d => {
        if (count++ >= 5) return;
        const data = d.data();
        html += renderAppRow(d.id, data, true);
      });
      document.getElementById('dash-recent').innerHTML = html || '<p style="color:var(--ink2);font-size:0.85rem">No applications yet.</p>';
    } catch(e) { console.error(e); }
  };

  // ── APPLICATIONS ──
  let _allApps = [];
  window.loadApplications = async function() {
    try {
      const snap = await window._getDocs(window._q(window._col(db,'applications'), window._orderBy('submittedAt','desc')));
      _allApps = [];
      snap.forEach(d => _allApps.push({ id: d.id, data: d.data() }));
      renderAppsList('all');
    } catch(e) { document.getElementById('apps-list').innerHTML = '<p style="color:#c44">Error loading applications.</p>'; }
  };

  function renderAppsList(filter) {
    const list = document.getElementById('apps-list');
    const apps = filter === 'all' ? _allApps : _allApps.filter(a => a.data.status === filter);
    if (!apps.length) { list.innerHTML = '<p style="color:var(--ink2);font-size:0.85rem">No applications found.</p>'; return; }
    list.innerHTML = apps.map(a => renderAppRow(a.id, a.data, false)).join('');
  }

  window.filterApps = function(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAppsList(filter);
  };

  function renderAppRow(docId, d, compact) {
    const statusMap = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected', waitlisted:'badge-waitlist' };
    const cls = statusMap[d.status] || 'badge-pending';
    const date = d.submittedAt?.toDate ? d.submittedAt.toDate().toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—';
    return `<div class="app-row">
      <div class="app-info">
        <div class="app-name">${d.firstname}${d.lastname?' '+d.lastname:''} <span style="font-weight:400;color:var(--ink2)">· @${d.username}</span></div>
        <div class="app-meta">
          <span>${d.trackId}</span><span>·</span><span>${d.region}</span><span>·</span><span>${date}</span>
          ${d.email ? `<span>·</span><span>${d.email}</span>` : ''}
        </div>
      </div>
      <span class="badge ${cls}">${d.status}</span>
      <div class="app-actions">
        <button class="act-btn view-btn" onclick="openModal('${docId}')"><i class="fa-solid fa-eye"></i> View</button>
        ${d.status!=='approved'  ? `<button class="act-btn approve"  onclick="setStatus('${docId}','approved')">Approve</button>`  : ''}
        ${d.status!=='rejected'  ? `<button class="act-btn reject"   onclick="setStatus('${docId}','rejected')">Reject</button>`   : ''}
        ${d.status!=='waitlisted'? `<button class="act-btn waitlist" onclick="setStatus('${docId}','waitlisted')">Waitlist</button>`: ''}
      </div>
    </div>`;
  }

  // ── STATUS UPDATE ──
  window.setStatus = async function(docId, status) {
    try {
      const updateData = { status };
      if (status === 'approved') updateData.approvedAt = window._serverTimestamp();
      await window._updateDoc(window._doc(db,'applications',docId), updateData);
      showToast('Status updated to ' + status);
      loadApplications();
      loadDashboard();
    } catch(e) { showToast('Error: ' + e.message); }
  };

  // ── MODAL ──
  window.openModal = async function(docId) {
    const app = _allApps.find(a => a.id === docId);
    if (!app) return;
    const d = app.data;
    document.getElementById('modal-content').innerHTML = `
      <p class="section-label"><i class="fa-solid fa-file-lines" style="margin-right:0.4rem"></i>Application Detail</p>
      ${[
        ['Track ID', d.trackId],
        ['Name', d.firstname + (d.lastname?' '+d.lastname:'') + ' (@'+d.username+')'],
        ['Email', d.email],
        ['Date of Birth', d.dob || '—'],
        ['Region', d.region],
        ['Nation', d.nation],
        ['Skills', d.skills || '—'],
        ['Heard via', d.source || '—'],
        ['Status', `<span class="badge ${({pending:'badge-pending',approved:'badge-approved',rejected:'badge-rejected',waitlisted:'badge-waitlist'}[d.status])}">${d.status}</span>`],
      ].map(([k,v]) => `<div class="modal-field"><div class="mk">${k}</div><div class="mv">${v}</div></div>`).join('')}
      <div style="margin:0.8rem 0 0.4rem;font-size:0.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink2)">Statement</div>
      <div class="modal-statement">${d.statement}</div>
      <div class="form-divider"></div>
      <div class="form-field">
        <label>Admin Note (visible to applicant)</label>
        <textarea class="note-input" id="modal-note" rows="3" placeholder="Optional note to the applicant…">${d.adminNote||''}</textarea>
      </div>
      <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem">
        ${d.status!=='approved'   ? `<button class="act-btn approve"  onclick="setStatusAndNote('${docId}','approved');closeModal()">Approve</button>`   : ''}
        ${d.status!=='rejected'   ? `<button class="act-btn reject"   onclick="setStatusAndNote('${docId}','rejected');closeModal()">Reject</button>`    : ''}
        ${d.status!=='waitlisted' ? `<button class="act-btn waitlist" onclick="setStatusAndNote('${docId}','waitlisted');closeModal()">Waitlist</button>` : ''}
        <button class="act-btn view-btn" onclick="saveNote('${docId}')"><i class="fa-solid fa-floppy-disk"></i> Save Note</button>
      </div>`;
    document.getElementById('modal').classList.add('open');
  };

  window.closeModal = function() { document.getElementById('modal').classList.remove('open'); };
  document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

  window.setStatusAndNote = async function(docId, status) {
    const note = document.getElementById('modal-note')?.value || '';
    const updateData = { status, adminNote: note };
    if (status === 'approved') updateData.approvedAt = window._serverTimestamp();
    try {
      await window._updateDoc(window._doc(db,'applications',docId), updateData);
      showToast('Status updated to ' + status);
      loadApplications(); loadDashboard();
    } catch(e) { showToast('Error: ' + e.message); }
  };

  window.saveNote = async function(docId) {
    const note = document.getElementById('modal-note')?.value || '';
    try {
      await window._updateDoc(window._doc(db,'applications',docId), { adminNote: note });
      showToast('Note saved.');
      loadApplications();
    } catch(e) { showToast('Error: ' + e.message); }
  };

  // ── POST NEWS ──
  window.postNews = async function() {
    const title  = document.getElementById('news-title').value.trim();
    const body   = document.getElementById('news-body').value.trim();
    const author = document.getElementById('news-author').value.trim() || 'Ministry of Nomashae';
    const cat    = document.querySelector('input[name="cat"]:checked')?.value || 'Announcement';
    if (!title || !body) { showToast('Headline and body are required.'); return; }
    try {
      await window._addDoc(window._col(db,'news'), { title, body, author, category: cat, createdAt: window._serverTimestamp() });
      document.getElementById('news-title').value = '';
      document.getElementById('news-body').value  = '';
      document.getElementById('news-author').value= '';
      showToast('News published!');
      loadNewsArchive();
    } catch(e) { showToast('Error: ' + e.message); }
  };

  // ── NEWS ARCHIVE ──
  window.loadNewsArchive = async function() {
    try {
      const snap = await window._getDocs(window._q(window._col(db,'news'), window._orderBy('createdAt','desc')));
      const el = document.getElementById('news-admin-list');
      if (snap.empty) { el.innerHTML = '<p style="color:var(--ink2);font-size:0.85rem">No news posted yet.</p>'; return; }
      el.innerHTML = '';
      snap.forEach(d => {
        const data = d.data();
        const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
        const row = document.createElement('div');
        row.className = 'news-admin-row';
        row.innerHTML = `
          <div style="flex:1;min-width:0">
            <div class="news-admin-title">${data.title}</div>
            <div class="news-admin-meta">${data.category} · ${date} · ${data.author}</div>
          </div>
          <button class="act-btn reject" onclick="deleteNews('${d.id}', this)"><i class="fa-solid fa-trash"></i> Delete</button>`;
        el.appendChild(row);
      });
    } catch(e) { console.error(e); }
  };

  window.deleteNews = async function(docId, btn) {
    if (!confirm('Delete this news post? This cannot be undone.')) return;
    try {
      await window._deleteDoc(window._doc(db,'news',docId));
      showToast('Post deleted.');
      loadNewsArchive();
    } catch(e) { showToast('Error: ' + e.message); }
  };
</script>

<script>
  // ── VIEW SWITCHING ──
  window.showView = function(id) {
    document.querySelectorAll('.admin-view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
    document.getElementById('view-' + id).classList.add('active');
    document.getElementById('lnk-' + id)?.classList.add('active');
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Enter key on login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') doLogin();
  });

  // Dark mode
  let isDark = false;
  try { isDark = localStorage.getItem('nmDark') === 'true'; } catch(e){}
  function applyDark() {
    document.body.setAttribute('data-theme', isDark ? 'dark':'light');
    const b = document.getElementById('dark-btn');
    if (b) { b.textContent = isDark ? 'Light':'Dark'; b.classList.toggle('active', isDark); }
  }
  document.getElementById('dark-btn')?.addEventListener('click', () => {
    isDark = !isDark; try { localStorage.setItem('nmDark', isDark); }catch(e){} applyDark();
  });
  applyDark();

  // Element theme
  function getEl() { const h=new Date().getHours(); return h>=6&&h<12?'air':h>=12&&h<18?'water':h>=18&&h<22?'fire':'earth'; }
  document.body.setAttribute('data-element', getEl());
</script>
</body>
</html>
